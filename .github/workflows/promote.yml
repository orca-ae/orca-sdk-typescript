name: Promote

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'How to bump VERSION on main after publishing stable'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare promotion
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      next_version: ${{ steps.compute.outputs.next_version }}
      last_rc_tag: ${{ steps.compute.outputs.last_rc_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute promotion + next version
        id: compute
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$VERSION' is not stable semver (X.Y.Z). Cannot promote."
            exit 1
          fi

          git fetch --tags --force origin >/dev/null 2>&1 || true

          LAST_RC_TAG=""
          MAX_RC=0
          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v${VERSION}-rc([0-9]+)$ ]]; then
              N="${BASH_REMATCH[1]}"
              if (( N > MAX_RC )); then
                MAX_RC=$N
                LAST_RC_TAG="$TAG"
              fi
            fi
          done < <(git tag -l "v${VERSION}-rc*")

          if [[ -z "$LAST_RC_TAG" ]]; then
            echo "::error::No RC tag found for version $VERSION. Run release-rc first."
            exit 1
          fi

          RC_COMMIT="$(git rev-parse "${LAST_RC_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ "$RC_COMMIT" != "$HEAD_COMMIT" ]]; then
            echo "::error::Refusing to promote: HEAD ($HEAD_COMMIT) does not match last RC tag $LAST_RC_TAG ($RC_COMMIT). New commits landed after the RC was cut."
            exit 1
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Stable tag v${VERSION} already exists. Cannot re-promote."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          case "$BUMP_TYPE" in
            major) NEXT_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEXT_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            *) echo "::error::Unknown bump_type '$BUMP_TYPE'"; exit 1 ;;
          esac

          echo "Promoting $VERSION (from $LAST_RC_TAG); next main version: $NEXT_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "last_rc_tag=$LAST_RC_TAG" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  promote:
    name: Promote and bump main
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag stable release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@orca-ae'

      - run: yarn install --frozen-lockfile
      - run: yarn build

      - name: Set package version for publish
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish stable to GitHub Packages
        run: |
          cd dist
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up RC tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to clean RC tags: '$VERSION' is not stable semver"
            exit 1
          fi
          git tag -l "v${VERSION}-rc*" | while IFS= read -r TAG; do
            if [ -n "$TAG" ]; then
              echo "Deleting tag: $TAG"
              git tag -d "$TAG"
              git push origin ":refs/tags/$TAG"
            fi
          done

      - name: Bump main to next version
        env:
          NEXT_VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          if [[ ! "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to bump main: '$NEXT_VERSION' is not stable semver"
            exit 1
          fi
          echo "$NEXT_VERSION" > VERSION
          npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version
          git add VERSION package.json
          git commit -m "Bump version to $NEXT_VERSION"
          git push origin main
