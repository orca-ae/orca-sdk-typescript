name: Release RC

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays 00:00 UTC
  workflow_dispatch:

concurrency:
  group: release-rc
  cancel-in-progress: false

jobs:
  release-rc:
    name: Release RC from main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next RC version
        id: version
        run: |
          BASE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$BASE_VERSION' is not stable semver (must be X.Y.Z with no -rc suffix). Run the promote workflow first or fix VERSION on main."
            exit 1
          fi

          git fetch --tags --force origin >/dev/null 2>&1 || true

          MAX_RC=0
          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v${BASE_VERSION}-rc([0-9]+)$ ]]; then
              N="${BASH_REMATCH[1]}"
              if (( N > MAX_RC )); then
                MAX_RC=$N
              fi
            fi
          done < <(git tag -l "v${BASE_VERSION}-rc*")

          NEXT_RC=$((MAX_RC + 1))
          RC_VERSION="${BASE_VERSION}-rc${NEXT_RC}"
          RC_TAG="v${RC_VERSION}"

          echo "Base version: $BASE_VERSION"
          echo "Next RC: $RC_VERSION"
          echo "rc_version=$RC_VERSION" >> "$GITHUB_OUTPUT"
          echo "rc_tag=$RC_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@orca-ae'

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test

      # Must run BEFORE `yarn build`: `make-dist-package-json.cjs` bakes the
      # current package.json version into `dist/package.json`, and we publish
      # `dist/`. Bumping after build left dist at the stable base version and
      # published that (409 Conflict on an already-published version).
      - name: Set package version for publish
        env:
          RC_VERSION: ${{ steps.version.outputs.rc_version }}
        run: npm version "$RC_VERSION" --no-git-tag-version --allow-same-version

      - run: yarn build

      - name: Tag and push
        env:
          RC_TAG: ${{ steps.version.outputs.rc_tag }}
        run: |
          git tag "$RC_TAG"
          git push origin "$RC_TAG"

      - name: Publish to GitHub Packages
        run: |
          cd dist
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
